name: readme-notify

services:
  mongo:
    image: mongo:8.3.17
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - '127.0.0.1:${MONGO_PORT}:27017'
    volumes:
      - notify-mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/typoteka-account --quiet
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - '127.0.0.1:${RABBITMQ_PORT}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT}:15672'
    volumes:
      - notify-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  fake-smtp-server:
    image: gessnerfl/fake-smtp-server:2.2.0
    environment:
      FAKESMTP_AUTHENTICATION_USERNAME: ${SMTP_USER}
      FAKESMTP_AUTHENTICATION_PASSWORD: ${SMTP_PASSWORD}
    ports:
      - '127.0.0.1:${SMTP_PORT}:8025'
      - '127.0.0.1:${FAKE_SMTP_HTTP_PORT}:8080'

volumes:
  notify-mongo-data:
  notify-rabbitmq-data:
